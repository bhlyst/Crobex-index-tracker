name: Crobex Daily Fetch

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 18:00 UTC
  workflow_dispatch:       # allow manual runs

permissions:
  contents: write          # allow git push

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: pip install pandas requests openpyxl

      # 4️⃣ Run your script
      - name: Run script
        run: python CROBEX_sastav.py

      # 5️⃣ Show working directory and files for debugging
      - name: Show working directory and files
        run: |
          pwd
          ls -l

      # 6️⃣ Commit & push CSV if it exists
      - name: Commit & push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          if [ -f crobex_constituents_history.csv ]; then
            git add crobex_constituents_history.csv
            git commit -m "Update Crobex constituents on $(date +'%Y-%m-%d')" || echo "No changes to commit"
            git push
          else
            echo "⚠️ CSV file not found — skipping commit."
          fi

      # 7️⃣ Upload CSV as artifact
      - name: Upload CSV artifact
        if: always()  # run even if previous step failed
        uses: actions/upload-artifact@v3
        with:
          name: crobex_csv
          path: crobex_constituents_history.csv

