name: Crobex Daily Fetch

on:
  schedule:
    - cron: "0 18 * * *"   # every day at 18:00 UTC
  workflow_dispatch:       # allow manual runs

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run script
        run: python CROBEX_sastav.py

      - name: Commit & push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          if [ -f crobex_constituents_history.csv ]; then
            git add crobex_constituents_history.csv
            git commit -m "Update Crobex constituents on $(date +'%Y-%m-%d')" || echo "No changes to commit"
            git push
          else
            echo "⚠️ File crobex_constituents_history.csv not found — skipping commit."
          fi
          git push
