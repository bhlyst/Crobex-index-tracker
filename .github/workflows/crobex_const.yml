name: Crobex Daily Fetch

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run script
        run: python CROBEX_sastav.py

      - name: Show working directory and files
        run: |
          pwd
          ls -l

      - name: Commit & push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          if [ -f crobex_sastav_povijest.csv ]; then
            git add crobex_sastav_povijest.csv
            git commit -m "Update Crobex constituents on $(date +'%Y-%m-%d')" || echo "No changes to commit"
            git push
          else
            echo "⚠️ CSV file not found — skipping commit."
          fi

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crobex_csv
          path: crobex_constituents_history.csv
